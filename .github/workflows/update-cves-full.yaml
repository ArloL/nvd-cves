name: Update CVEs (full)

on:
  workflow_dispatch:
  schedule:
  # 4x daily during the fetch experiment; back to "34 4 * * *" afterwards.
  - cron: "34 4,10,16,22 * * *"
permissions: {}
concurrency: update-cves

jobs:
  update-cves:
    name: Update CVEs (full)
    permissions:
      contents: write
    uses: $/.github/workflows/cve-import.yaml
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    with:
      full_import: true
