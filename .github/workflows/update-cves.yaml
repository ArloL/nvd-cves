name: Update CVEs

on:
  workflow_dispatch:
  schedule:
  - cron: "13 */2 * * *"
permissions: {}

jobs:
  update-cves:
    name: Update CVEs
    uses: ./.github/workflows/cve-import.yaml
    permissions:
      contents: write
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    with:
      full_import: false
